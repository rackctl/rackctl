name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # A step of `build` rather than a job of its own, deliberately: protect-main requires the
      # `build` context, so putting lint here makes it enforced immediately. A separate job would
      # be advisory until somebody remembered to add it to the ruleset, and an advisory gate on a
      # repo with a no-bypass ruleset is just a slower way of not having one.
      #
      # It runs before build and test because its most valuable linter is `unused`, and dead code
      # compiles and passes tests by definition — this repo shipped two such symbols.
      #
      # Pinned to the same version developers get from Homebrew, so a clean local run means a
      # clean CI run. Config in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - run: go build ./...
      - run: go test -race ./...
      # Two-layer supply-chain gate. govulncheck is Go-native and
      # reachability-aware (flags only vulnerabilities reachable in the call
      # graph); osv-scanner is the estate-wide OSV-database gate every JS repo
      # runs, here broadening coverage to the whole module graph. Both are pinned
      # for reproducible CI and both fail the build.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
