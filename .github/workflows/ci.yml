name: ci

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN is read-write on a push to main. Nothing in this workflow
# writes anything, so the token it runs with should not be able to — an action compromised
# anywhere in the graph inherits whatever the job holds.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag is mutable: whoever can move
      # it can change what runs here, and the version comment is what Renovate reads to
      # keep the pin current.
      #
      # persist-credentials: false because checkout otherwise leaves the job token in
      # .git/config, where every later step — and every action they call — can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # A step of `build` rather than a job of its own, deliberately: protect-main requires the
      # `build` context, so putting lint here makes it enforced immediately. A separate job would
      # be advisory until somebody remembered to add it to the ruleset, and an advisory gate on a
      # repo with a no-bypass ruleset is just a slower way of not having one.
      #
      # It runs before build and test because its most valuable linter is `unused`, and dead
      # code compiles and passes tests by definition — so no amount of testing can find it.
      #
      # Pinned to the same version developers get from Homebrew, so a clean local run means a
      # clean CI run. Config in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - run: go build ./...
      - run: go test -race ./...
      # A coverage floor that nothing gates on is a number, not a guarantee: it falls
      # silently, and it falls fastest in the code least pleasant to test — which here is
      # the code that terminates instances and deletes roles. Runs as a step of `build`
      # for the same reason lint does, so it gates a merge rather than being advisory.
      - name: coverage
        run: ./scripts/coverage.sh
      # Every gate in scripts/ proves it can still reject before its verdict is believed.
      # A check that cannot fail is worse than no check, because it reports success — and
      # both halves rot independently: a self-test nothing invokes, and a CI step that
      # never runs one. This step is the second half.
      # The floor SUPPLIES a known-bad input to each gate and observes the exit status.
      # Nothing a gate prints about itself is consulted: a four-line script that echoed
      # "control: … rejected" and exited 0 passed the previous version of this step with
      # zero checks behind it.
      - name: gate floor
        run: python3 ./scripts/floor.py
      # Every version the repo pins is matched by a Renovate manager. Asserted rather than
      # described: a comment claiming full coverage goes stale silently at the first edit
      # that adds a pin, while this fails the build.
      - name: renovate pin coverage
        run: python3 ./scripts/pins.py
      # The config that watching depends on had never been validated. It is a fact about
      # the commit — a malformed manager watches nothing and says nothing, so pins.py would
      # report a pin covered by a rule Renovate silently discards.
      #
      # Its coverage is partial, and stating that is the point: it rejects an unknown
      # configuration KEY, verified by planting one, but accepted a datasourceTemplate
      # naming a datasource that does not exist. Schema validity, not semantic validity.
      - name: renovate config
        run: npx --yes --package renovate -- renovate-config-validator .github/renovate.json
      # The enforceable subset of documentation-voice: verification tallies, internal
      # issue/PR/ledger references, prose addressed to an agent, and unowned markers.
      # The rest of that standard is review — a gate claiming coverage it does not have is
      # itself the failure mode, so this one states its subset and holds only that.
      - name: prose
        run: python3 ./scripts/prose.py
      # With no package manifest beyond go.mod, the workflows ARE a dependency surface —
      # every action runs with the job's token and permissions. --offline so the verdict is
      # a function of the commit under test rather than of what GitHub's API answers today.
      - name: zizmor
        run: |
          pip install --quiet zizmor==1.16.3
          zizmor --offline --persona regular .github/workflows/
      # The vulnerability scanners are NOT here. Their verdict changes when a CVE is
      # published, which is not something the commit under test caused — blocking a merge
      # on the world changing is how a gate teaches people to bypass it. They run on a
      # schedule instead, blocking there, in .github/workflows/vulnerabilities.yml.
      #
      # What stays blocking is what the commit controls: formatting, vet, lint, the build,
      # the tests, the coverage floors, the gate suite, pin coverage, prose, and the
      # workflow audit — which runs --offline for exactly this reason.
