version: 2
project_name: rackctl

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/rackctl/rackctl/cmd.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    # Must match scripts/install.sh: rackctl_<os>_<arch>.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  # A formula, not a cask, on purpose. goreleaser nudges toward homebrew_casks,
  # but casks are macOS-only and this binary ships for Linux too — docs/install
  # advertises `brew install rackctl/tap/rackctl` on both. Revisit only when
  # goreleaser actually removes `brews` (it still works as of v2.17.1: `check`
  # exits 2 on the deprecation, `release` succeeds), and treat dropping
  # Linuxbrew as the cost of that move.
  - repository:
      owner: rackctl
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      # rackctl/homebrew-tap protects main with a no-bypass ruleset, so the bot
      # cannot push the formula bump directly — it opens a PR instead.
      pull_request:
        enabled: true
    homepage: "https://rackctl.sh"
    # No leading article. `brew audit` flags a desc that starts with one, and the
    # formula's desc is generated from this field — editing rackctl.rb directly is
    # undone by the next release, because that file carries goreleaser's DO NOT EDIT
    # header. The CLI's own `Short` in cmd/root.go keeps its article; that string is
    # help text, not a formula field, and homebrew's rule does not reach it.
    description: "Day-0 installer for a nanohype platform"
    license: "Apache-2.0"
    install: |
      bin.install "rackctl"
    # What `brew test rackctl` runs. Without this field goreleaser emits no `test do`
    # block at all, so the formula ships untestable — and a `test do` hand-added to the
    # tap is overwritten by the next release for the same DO NOT EDIT reason.
    #
    # Asserting on the reported version rather than just a zero exit makes this a real
    # check of the release rather than a smoke test. The version is injected at build
    # time (`-X github.com/rackctl/rackctl/cmd.Version={{ .Version }}` in the build's
    # ldflags), so a binary built without those flags reports the `0.0.0-dev` default
    # and a binary built from the wrong tag reports the wrong number. Both install
    # cleanly and both fail here, which is precisely the failure a formula test exists
    # to catch.
    test: |
      assert_match version.to_s, shell_output("#{bin}/rackctl version")

release:
  github:
    owner: rackctl
    name: rackctl
  # scripts/install.sh resolves the version from /releases/latest, which GitHub
  # never answers with a prerelease. Without this, goreleaser defaults to
  # prerelease=false and make_latest=true, so ANY tag — including a throwaway
  # like v0.0.0-rc1 — becomes "Latest" and `curl rackctl.sh/install | sh` starts
  # serving it. `auto` marks a tag as a prerelease when it carries a prerelease
  # identifier, so suffixed tags can never displace the real release.
  prerelease: auto
  # Belt and braces on the same failure, via a different mechanism: .Prerelease
  # is read straight off the tag's semver, not from the setting above, so this
  # still holds if `auto` ever stops detecting. Two independent guards, because
  # the blast radius is every `curl rackctl.sh/install | sh` until someone
  # notices.
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
