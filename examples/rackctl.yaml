# rackctl full-provision config — AWS, development.
# `rackctl plan -c examples/rackctl.yaml`, then `rackctl apply -c examples/rackctl.yaml`.
org:
  name: acme
  gitops:
    eksGitopsRepo: github.com/acme/eks-gitops   # operator's fork of nanohype/eks-gitops
    # clustersRepo/tenantsRepo only needed when controlPlane.eksFleet/portal are true

cloud:
  provider: aws
  accountId: "111111111111"
  region: us-west-2
  profile: workload-development  # AWS SSO profile

environment: development         # development | staging | production

cluster:
  name: platform                 # cluster base; the EKS cluster is <environment>-<name> (development-platform). Required, unique per account+env, must != environment
  version: "1.36"                # Kubernetes major.minor. Matches landing-zone's default. Injected as TF_VAR_cluster_version ONLY when it differs from this default — an ambient TF_VAR would otherwise silently override a leaf that pins a different version
  endpointPublicAccess: true     # prod MUST be false (needs bastion/VPN). landing-zone is private-by-default; rackctl supplies this posture at apply time
  endpointAllowlist: []          # CIDRs allowed to reach the public API endpoint. Empty + public => rackctl auto-detects this host's egress IP as <ip>/32 (never 0.0.0.0/0). Explicit entries win, e.g. [203.0.113.4/32]
  systemNodes:
    instanceTypes: [m7g.xlarge, m6g.xlarge]  # matches landing-zone; a value equal to this default is never injected, so the shown list is what you get
    minSize: 2
    maxSize: 6
    desiredSize: 2               # injected as system_node_* ONLY when any field differs from these defaults, so staging/production leaf pins stand
  network:
    mode: create                  # create (default) | adopt
                                  #   create — this platform owns its VPC: builds the VPC, subnets, endpoints,
                                  #            egress and the ELB role tags. What a day-0 hub normally wants.
                                  #   adopt  — participate in a VPC someone else owns (a shared VPC in this
                                  #            account, or one shared in over AWS RAM). Builds NOTHING: the VPC,
                                  #            subnets, CIDR and AZs are resolved from the adopt* fields below and
                                  #            re-exported through the same outputs, so the cluster wires
                                  #            identically either way. The owner runs the VPC, the endpoints, the
                                  #            egress and the subnet tagging.
                                  #
                                  # Under adopt, rackctl also sends nat_gateways=1 and enable_flow_logs=false to
                                  # neutralize the create-mode values the staging and production leaves pin (3 and
                                  # true), which landing-zone rejects under adopt. Both are the owner's concern for
                                  # a VPC this platform does not own, so overriding them changes nothing real.
    vpcCidr: 10.0.0.0/16          # create mode only. The DEFAULT shown here is accepted under adopt — it is the
                                  # sentinel for "not overridden", so adopt does not make you delete this line — but
                                  # any OTHER value is rejected there, because an adopted VPC's CIDR is the owner's.
                                  # Injected as TF_VAR_vpc_cidr only when it differs from this default.
    natGateways: 1                # create mode only; 1 (shared NAT) or equal to the AZ count (per-AZ HA).
                                  # Injected as TF_VAR_nat_gateways ONLY when it differs from 1 — staging and
                                  # production pin 3 in their own leaves for per-AZ redundancy, and an injected
                                  # default would silently downgrade them.
    # --- adopt mode ----------------------------------------------------------------------
    # Required when mode: adopt, rejected under create. rackctl validates the shape up front
    # (ids well-formed, no subnet in both tiers, at least 3 distinct private subnets for the
    # zone spread landing-zone asserts); landing-zone then asserts the rest at plan time
    # against live AWS — every subnet is in the VPC, each private route table routes to the S3
    # gateway prefix list and to a live NAT or transit gateway, and the subnets span the zones.
    #
    # adoptVpcId: vpc-0abc123
    # adoptPrivateSubnetIds: [subnet-0aaa, subnet-0bbb, subnet-0ccc]   # where nodes and pods run
    # adoptPublicSubnetIds: [subnet-0ddd, subnet-0eee, subnet-0fff]    # optional — omit for a private-only
    #                                                                 # cluster. Internal load balancers work;
    #                                                                 # an internet-facing Service/Ingress will
    #                                                                 # NOT provision, because the Kyverno rule
    #                                                                 # that injects LB subnets needs a non-empty
    #                                                                 # public list (from the network-config ConfigMap)
    #
    # --- create-mode levers ---------------------------------------------------------------
    # All off by default, and all rejected under adopt. These ride TF_VAR_* onto
    # landing-zone's private-by-default network component at apply time, layered over the
    # generic committed tree exactly like the endpoint posture. rackctl validates the
    # combination up front, so a contradiction fails in a second here instead of
    # seconds-to-minutes into a tofu run. Uncomment to opt into the org's IPAM /
    # transit-gateway topology:
    #
    # ipamPoolId: ipam-pool-0abc123   # draw the VPC CIDR from an IPAM pool instead of vpcCidr; leave vpcCidr at its default (mutually exclusive with a non-default vpcCidr)
    # ipamNetmaskLength: 18           # netmask of the CIDR carved from the pool, 16–20 (required with ipamPoolId; subnets carve 8 bits smaller, so /20 is the smallest that clears AWS's /28 minimum)
    # transitGatewayId: tgw-0abc123   # attach the VPC to a transit gateway (10.0.0.0/8 → TGW); requires an IPAM-allocated CIDR so prefixes never overlap
    # centralizedEgress: true         # private default route via the TGW to a central egress VPC, zero local NAT gateways; requires transitGatewayId

quotas:
  autoRequest: true               # file L-1216C47A (EC2 vCPU) etc. before provisioning
  vcpu: 256

observability:
  tier: full                      # full | floor. Published as the observability/tier label on the ArgoCD cluster
                                  # Secret, which the tier-aware eks-gitops ApplicationSets select on (and a few
                                  # derive Helm parameters from).
                                  #   full  (default) — the in-cluster LGTM stack (Loki, Tempo, kube-state-metrics,
                                  #                     grafana-operator) plus Amazon Managed Prometheus / Grafana.
                                  #                     rackctl applies managed-monitoring, which is what publishes
                                  #                     the AMP endpoint the tier-gated ExternalSecret reads.
                                  #   floor           — CloudWatch only: ContainerInsights metrics plus the OTel
                                  #                     gateway exporting EMF metrics and logs to CloudWatch Logs.
                                  #                     No AMP/AMG cost.
                                  # Both tiers run the OTel node agent and a gateway on the same endpoint, so a
                                  # tenant chart is byte-identical across tiers — only the exporters differ.
                                  # One field on purpose: the tier and managed-monitoring cannot be set to disagree,
                                  # because a cluster labelled full with no AMP behind it sits in permanent
                                  # SecretSyncedError.

addons:
  druid: false                    # per-tenant analytics substrate (Aurora Serverless, optionally MSK). Real money;
                                  # its live leaf carries its own tenant sizing map. Applied when true; lives under
                                  # every workload environment.
                                  #
                                  # TEARDOWN: development tears down cleanly. Outside development it needs
                                  # `rackctl destroy --force-buckets`, which is two acts: the permitting
                                  # apply lands force_destroy on the per-tenant buckets AND clears the tenant
                                  # Aurora's deletion_protection, and only then does the destroy reach them. Without
                                  # the flag the destroy deletes the deepstorage segments (no versioning, no expiry,
                                  # only copy) and then wedges on DeleteDBCluster with the cluster and VPC billing.
                                  #
                                  # `accelerators` used to sit here. The GPU path is deleted upstream — the
                                  # ApplicationSet, the accelerator-pools component and its live roots, and
                                  # landing-zone's variable and cluster label. A config still carrying the key is
                                  # REFUSED at load rather than ignored, because the decoder drops unknown keys and
                                  # a request that silently gets nothing is the failure this tool exists to remove.
                                  # The model path is Bedrock; see agentPlatform below.

dns:
  hostedZone: acme.example.com   # the zone this platform owns. Applies landing-zone's dns component, which creates
                                 # the Route53 hosted zone, publishes the zone as external-dns's domain filter to
                                 # /eks-agent-platform/<environment>/dns/domain_filter, and requests one wildcard
                                 # ACM certificate for *.<zone> (SAN <zone>).
                                 #
                                 # Omit the block entirely to skip DNS: nothing creates a zone, and rackctl sets
                                 # enable_external_dns=false so cluster-bootstrap does not try to read the missing
                                 # SSM parameter (every committed leaf pins that flag true).
                                 #
                                 # Every committed dns leaf pins a *.example.com placeholder in its own inputs, so
                                 # this value is what makes the component operate on a real domain.
                                 #
                                 # rackctl does NOT wait for the certificate to validate, and cannot: this apply is
                                 # creating the zone, so the registrar's NS records still point wherever they pointed
                                 # before, and ACM validates by resolving a record over public DNS. Point <zone>'s NS
                                 # records at the name servers this apply prints and the certificate issues on its own
                                 # — ACM retries for 72 hours and the validation record is already in the zone.

agentPlatform:
  enable: true                    # rides TF_VAR_enable_agent_platform. false also skips agent-iam, so the two stay
                                  # consistent: no operator without its IAM role, no IAM role without an operator
  bedrockModelFamilies: [anthropic, amazon-nova]  # maps to agent-iam's bedrock_allowed_model_ids (anthropic.*,
                                                  # amazon.nova-*). Injected only when the list differs from this
                                                  # default, so narrowing the config also narrows the IAM baseline
                                                  # rather than only the tenant CR
  modelImport: false            # off by default. Applies landing-zone's model-import component, which provisions
                                # ONLY the Bedrock Custom Model Import substrate for this environment: the S3
                                # staging bucket <environment>-<account>-<region>-model-import, the import service
                                # role model-import-<environment>-<region>, and the SSM discovery parameters
                                # /eks-agent-platform/<environment>/model-import/{staging_bucket_name,import_role_arn}.
                                # It imports NO model — that is a deliberate, infrequent, out-of-band human act
                                # (eks-agent-platform/docs/runbooks/import-open-weight-model.md). Requires
                                # agentPlatform.enable and a region where Custom Model Import runs (us-west-2,
                                # us-east-1, us-east-2, eu-central-1); rackctl rejects the rest at validation,
                                # because the component applies cleanly elsewhere and is silently unusable.
                                # Destroyed with everything else — landing-zone scopes it by environment and gives
                                # it a teardown posture, so nothing here outlives its cluster.
  compliance:
    soc2: true
    hipaa: false

controlPlane:
  eksFleet: false                 # opt-in: Crossplane cluster control plane. Requires org.gitops.clustersRepo
                                  # and fleetHubRoleArn below.
  # fleetHubRoleArn: arn:aws:iam::111111111111:role/eks-fleet-crossplane
                                  # the IAM role provider-opentofu assumes to vend spokes. REQUIRED with
                                  # eksFleet: eks-fleet ships config/bootstrap/providers.yaml with a literal
                                  # <FLEET_ACCOUNT_ID> placeholder and its stand-up doc substitutes the real
                                  # ARN at apply time, so applying it unrendered installs a provider that
                                  # never receives credentials — while still reporting Healthy.
                                  # Get it from landing-zone's fleet-hub component, which rackctl does NOT
                                  # apply (it lives under live/aws/fleet/…, a different account):
                                  #   terragrunt output -raw hub_role_arn
  portal: false                   # opt-in: day-2 operator UI

firstTenant:                      # optional smoke test (phase 9). Vends this tenant from
                                  # eks-agent-platform/charts/tenant into the eks-agent-platform namespace and
                                  # waits for status.phase: Ready. It proves the vending + identity path only —
                                  # charts/tenant cannot express spec.datastores, spec.identity.capabilities or
                                  # spec.identity.directSecretReads, which is where a tenant's AWS grants now
                                  # come from.
  name: blank
  persona: generic
  tenant: example
  monthlyBudgetUsd: 100
